<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>板块热度</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>板块热度</h1>
                <p>大科技与短线轮动方向的资金、强度和龙头对比</p>
            </div>
            <div class="header-right">
                <select id="universe-selector">
                    <option value="tech">大科技</option>
                    <option value="rotation">短线轮动</option>
                    <option value="power">电力</option>
                    <option value="innovative_drug">创新药</option>
                    <option value="consumer">消费</option>
                    <option value="coal_oil_gas">煤炭油气</option>
                    <option value="nonferrous">有色黄金</option>
                    <option value="all">全部观察池</option>
                </select>
                <select id="sort-selector">
                    <option value="score">综合评分</option>
                    <option value="short_term">短线轮动</option>
                    <option value="tomorrow">明日建仓</option>
                    <option value="flow_persistence">资金持续</option>
                    <option value="pullback">回踩机会</option>
                </select>
                <button id="refresh-btn" type="button">刷新</button>
                <button id="save-btn" type="button">保存快照</button>
                <a class="back-link" href="/rotation">短线轮动</a>
                <a class="back-link" href="/">返回首页</a>
            </div>
        </header>

        <div class="cards" id="sector-cards"></div>

        <section class="section">
            <div class="section-title">
                <h3>板块明细</h3>
                <span id="updated-at">--</span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>排名</th>
                            <th>板块</th>
                            <th>热度</th>
                            <th>风险</th>
                            <th>ETF动作</th>
                            <th>短期</th>
                            <th>长期</th>
                            <th>股票数</th>
                            <th>上涨/下跌</th>
                            <th>平均涨跌</th>
                            <th>今日资金</th>
                            <th>3日资金</th>
                            <th>30日资金</th>
                            <th>最强股票</th>
                        </tr>
                    </thead>
                    <tbody id="sector-body"></tbody>
                </table>
            </div>
        </section>

        <section class="section sector-stock-section">
            <div class="section-title">
                <h3>板块预测分析</h3>
                <span id="selected-sector">--</span>
            </div>
            <div id="sector-prediction" class="sector-prediction"></div>
            <div id="sector-stocks" class="sector-stock-grid"></div>
        </section>
    </div>

    <script>
        let sectors = [];
        let selectedKey = '';

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('refresh-btn').addEventListener('click', () => loadSectors(false));
            document.getElementById('save-btn').addEventListener('click', () => loadSectors(true));
            document.getElementById('universe-selector').addEventListener('change', onUniverseChange);
            document.getElementById('sort-selector').addEventListener('change', () => loadSectors(false));
            loadSectors(false);
        });

        function onUniverseChange() {
            const universe = document.getElementById('universe-selector').value;
            const sort = document.getElementById('sort-selector');
            if (universe !== 'tech' && sort.value === 'score') {
                sort.value = 'short_term';
            }
            loadSectors(false);
        }

        async function loadSectors(save) {
            const universe = encodeURIComponent(document.getElementById('universe-selector').value);
            const sortBy = encodeURIComponent(document.getElementById('sort-selector').value);
            const resp = await fetch(`/api/sectors?universe=${universe}&sort_by=${sortBy}${save ? '&save=1' : ''}`);
            const data = await resp.json();
            sectors = data.items || [];
            selectedKey = selectedKey && sectors.some(x => x.key === selectedKey) ? selectedKey : (sectors[0] ? sectors[0].key : '');
            const universeText = document.getElementById('universe-selector').selectedOptions[0].textContent;
            document.getElementById('updated-at').textContent = save && data.saved ? `${universeText} ${data.updated_at} / 已保存 ${data.saved}` : `${universeText} ${data.updated_at || '--'}`;
            renderCards();
            renderTable();
            renderSectorStocks();
        }

        function renderCards() {
            const top = sectors.slice(0, 4);
            const box = document.getElementById('sector-cards');
            if (!top.length) {
                box.innerHTML = '<div class="card"><div class="card-label">暂无板块</div><div class="card-value card-value-sm">等待数据</div></div>';
                return;
            }
            box.innerHTML = top.map(item => `
                <div class="card">
                    <div class="card-label">${item.name}</div>
                    <div class="card-value">${Number(item.short_score || 0).toFixed(1)}</div>
                    <div class="muted">短期${item.short_grade || '-'} / 长期${item.long_grade || '-'}，${item.etf_action || '-'}</div>
                </div>
            `).join('');
        }

        function renderTable() {
            const body = document.getElementById('sector-body');
            if (!sectors.length) {
                body.innerHTML = '<tr><td colspan="14" class="empty">暂无板块数据</td></tr>';
                return;
            }
            body.innerHTML = sectors.map((item, idx) => {
                const active = item.key === selectedKey ? ' class="selected-row"' : '';
                const strongest = item.strongest || {};
                return `<tr${active} data-key="${item.key}">
                    <td>${idx + 1}</td>
                    <td>${item.name}</td>
                    <td><span class="score-pill">${Number(item.heat_score || 0).toFixed(1)}</span></td>
                    <td>${item.risk_level || '-'}</td>
                    <td>${item.etf_action || '-'}</td>
                    <td><span class="score-pill">${Number(item.short_score || 0).toFixed(1)}</span> ${item.short_grade || ''}</td>
                    <td><span class="score-pill">${Number(item.long_score || 0).toFixed(1)}</span> ${item.long_grade || ''}</td>
                    <td>${item.stock_count || 0}</td>
                    <td>${item.up_count || 0}/${item.down_count || 0}</td>
                    <td class="${Number(item.avg_pct_change || 0) >= 0 ? 'profit' : 'loss'}">${formatPct(item.avg_pct_change)}</td>
                    <td class="${Number(item.main_net || 0) >= 0 ? 'profit' : 'loss'}">${formatAmount(item.main_net)}</td>
                    <td class="${Number(item.main_net_3d || 0) >= 0 ? 'profit' : 'loss'}">${formatAmount(item.main_net_3d)}</td>
                    <td class="${Number(item.main_net_30d || 0) >= 0 ? 'profit' : 'loss'}">${formatAmount(item.main_net_30d)}</td>
                    <td>${strongest.code || '-'} ${strongest.name || ''}</td>
                </tr>`;
            }).join('');
            body.querySelectorAll('tr[data-key]').forEach(row => {
                row.addEventListener('click', () => {
                    selectedKey = row.dataset.key;
                    renderTable();
                    renderSectorStocks();
                });
            });
        }

        function renderSectorStocks() {
            const sector = sectors.find(x => x.key === selectedKey);
            const box = document.getElementById('sector-stocks');
            const prediction = document.getElementById('sector-prediction');
            document.getElementById('selected-sector').textContent = sector ? sector.name : '--';
            if (!sector || !(sector.top_stocks || []).length) {
                prediction.innerHTML = '';
                box.innerHTML = '<div class="empty-panel">暂无股票</div>';
                return;
            }
            prediction.innerHTML = `
                <div>
                    <span>短期适合度</span>
                    <strong>${Number(sector.short_score || 0).toFixed(1)} / ${sector.short_grade || '-'}</strong>
                    <p>${sector.short_reason || '-'}</p>
                </div>
                <div>
                    <span>长期适合度</span>
                    <strong>${Number(sector.long_score || 0).toFixed(1)} / ${sector.long_grade || '-'}</strong>
                    <p>${sector.long_reason || '-'}</p>
                </div>
                <div>
                    <span>基金/ETF动作</span>
                    <strong>${sector.etf_action || '-'}</strong>
                    <p>热度 ${Number(sector.heat_score || 0).toFixed(1)}，30日资金 ${formatAmount(sector.main_net_30d)}</p>
                </div>
            `;
            box.innerHTML = sector.top_stocks.map(stock => `
                <a class="sector-stock-card" href="/stock/${stock.code}">
                    <strong>${stock.code} ${stock.name}</strong>
                    <span>短线 ${Number(stock.short_term_score || 0).toFixed(1)} / 建仓 ${Number(stock.tomorrow_score || 0).toFixed(1)} / 综合 ${Number(stock.score || 0).toFixed(1)}</span>
                    <span class="${Number(stock.main_net || 0) >= 0 ? 'profit' : 'loss'}">今日资金 ${formatAmount(stock.main_net)}</span>
                    <span>${stock.entry_status || stock.tomorrow_action || '-'}</span>
                </a>
            `).join('');
        }

        function formatAmount(value) {
            const val = Number(value || 0);
            const sign = val < 0 ? '-' : '';
            const abs = Math.abs(val);
            if (abs >= 1e8) return `${sign}${(abs / 1e8).toFixed(2)}亿`;
            if (abs >= 1e4) return `${sign}${(abs / 1e4).toFixed(2)}万`;
            return `${sign}${abs.toFixed(0)}`;
        }

        function formatPct(value) {
            const val = Number(value || 0);
            return `${val >= 0 ? '+' : ''}${val.toFixed(2)}%`;
        }
    </script>
</body>
</html>
