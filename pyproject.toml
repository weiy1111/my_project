[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-agent"
version = "0.1.0"
description = "Protocol bridge between task schedulers, agent runtimes, and IM channels"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "cryptography>=41",
    "httpx>=0.27",
    "jsonschema>=4.20",
    "mcp>=1.20,<2",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
auto-agent = "auto_agent.cli:main"
auto-agent-skills = "auto_agent.skills.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
